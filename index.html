<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Elizabeth Aperghis — Events Portfolio</title><meta name="description" content="Luxury events, brand collaborations and creative projects by Elizabeth Aperghis."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"><style id="css">*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F6F1EA; --bg-2:#EBD9D3; --ph:#EADAD4; --ph-ink:#782F40;
  --ink:#782F40; --ink-2:#A3243B; --text:#2B1D19; --muted:rgba(43,29,25,.7);
  --line:rgba(120,47,64,.28); --band:#782F40; --on-band:#F6F1EA; --field:#FBF8F3;
  --lb-bg:rgba(30,19,17,.97); --lb-text:#F6F1EA; --toast-bg:#2B1D19; --toast-text:#F6F1EA;
  --serif:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(20px,3.9vw,56px);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1513; --bg-2:#2C1D1C; --ph:#33221F; --ph-ink:#E0B9BB;
    --ink:#E6C3C4; --ink-2:#F28E9F; --text:#F2E9E0; --muted:rgba(242,233,224,.7);
    --line:rgba(230,195,196,.24); --band:#5E2130; --on-band:#F6F1EA; --field:#251A18;
    --toast-bg:#F2E9E0; --toast-text:#1D1513; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1513; --bg-2:#2C1D1C; --ph:#33221F; --ph-ink:#E0B9BB;
  --ink:#E6C3C4; --ink-2:#F28E9F; --text:#F2E9E0; --muted:rgba(242,233,224,.7);
  --line:rgba(230,195,196,.24); --band:#5E2130; --on-band:#F6F1EA; --field:#251A18;
  --toast-bg:#F2E9E0; --toast-text:#1D1513; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
html.lb-on body{overflow:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:3px}
.cap{font:500 11px/1.45 var(--sans);letter-spacing:.18em;text-transform:uppercase}
#root{transition:opacity .22s ease}
#root.out{opacity:0}

/* placeholders */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ph);color:var(--ph-ink);width:100%;height:100%}
.ph::before{content:"✕";font:400 20px/1 var(--serif);opacity:.38}
.ph .cap{opacity:.6}
.ph.fill{position:absolute;inset:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px var(--pad);background:transparent;transition:background-color .35s ease}
.nav.scrolled{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:baseline;gap:14px;color:var(--ink);text-decoration:none;min-width:0}
.brand b{font:400 22px/1 var(--serif);white-space:nowrap}
.brand small{color:var(--ink);opacity:.85;white-space:nowrap}
.nav-l{display:flex;gap:40px}
.nav-l a,.lnk{color:var(--ink);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s cubic-bezier(.2,.7,.1,1);padding-bottom:2px}
.nav-l a:hover,.lnk:hover{background-size:100% 1px}
.lnk{font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;display:inline-block}
.lnk.u{background-size:100% 1px}
@media (max-width:720px){.brand small{display:none}.nav-l{gap:22px}}

/* hero */
.hero{padding:0 var(--pad)}
.hero-media{position:relative;height:min(76vh,800px);min-height:440px;overflow:hidden;background:var(--ph)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.07);animation:heroImg 2.2s cubic-bezier(.2,.7,.1,1) .1s forwards}
.hero-media.has-img::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(30,19,17,.28),rgba(30,19,17,.06) 70%)}
.hero-name{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#F6F1EA;padding:0 4vw;pointer-events:none}
.hero-media.light .hero-name{color:#F6F1EA}
.hero-name h1{margin:0;font:400 clamp(54px,11.2vw,184px)/.92 var(--serif);letter-spacing:-.035em}
.wd{display:inline-block;white-space:nowrap;overflow:hidden;padding:0 .02em .1em;vertical-align:top}
.ch{display:inline-block}
.hero-sub{margin:14px 0 0}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;padding:22px 0 30px}
.hero-meta p{margin:0;max-width:36ch;font-size:14px;line-height:1.6}
.hero-dates{list-style:none;margin:0;padding:0;text-align:right;color:var(--ink);display:grid;gap:8px}
.hero-dates span{opacity:.6;margin:0 .35em}
.hero-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:14px 0 20px;color:var(--ink)}
.hero-foot a{font:inherit;letter-spacing:inherit}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes heroImg{to{transform:scale(1)}}
@media (max-width:720px){.hero-meta{flex-direction:column}.hero-dates{text-align:left}.hero-media{height:62vh;min-height:380px}}

/* marquee */
.marquee{background:var(--band);color:var(--on-band);overflow:hidden;padding:18px 0}
.marquee-track{display:flex;width:max-content;animation:mq 48s linear infinite}
.marquee span{font:400 clamp(22px,2.2vw,30px)/1.1 var(--serif);padding:0 28px;white-space:nowrap}
.marquee .dot{opacity:.55;padding:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* selected events */
.sec-title{margin:0;padding:clamp(64px,7vw,104px) var(--pad) clamp(32px,4vw,56px);font:400 clamp(56px,8.4vw,124px)/.95 var(--serif);letter-spacing:-.03em;color:var(--ink)}
.spread{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(32px,4.4vw,64px);padding:0 var(--pad) clamp(72px,8vw,120px);align-items:start}
.spread--rev .sp-cover{order:2}
.sp-cover{position:relative;display:block;aspect-ratio:8/9;overflow:hidden;background:var(--ph)}
.sp-cover img,.sp-cover video{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.1,1),opacity .9s ease}
.sp-cover:hover img{transform:scale(1.035)}
.sp-num{margin:0 0 clamp(28px,4vw,56px);font:400 clamp(76px,9vw,132px)/.82 var(--serif);color:var(--ink-2);letter-spacing:-.04em}
.sp-meta{margin:0 0 28px;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--ink)}
.draft-tag{font-style:normal;background:var(--ink);color:var(--bg);padding:2px 7px;margin-left:8px}
.title{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.12em .3em;font:400 clamp(36px,4.3vw,62px)/1.05 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.t-logo{height:.82em;width:auto;max-width:100%}
.venue{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;color:var(--ink)}
.v-name{font:italic 400 clamp(22px,2.2vw,30px)/1.15 var(--serif)}
.v-logo{height:clamp(34px,3.6vw,52px);width:auto;max-width:280px}
.sp-desc{margin:28px 0 22px;max-width:46ch;font-size:16px;line-height:1.7}
.sp-detail{display:block;width:min(280px,62%);aspect-ratio:1;margin:56px 0 0 auto;overflow:hidden;background:var(--ph)}
.spread--rev .sp-detail{margin-left:0}
.sp-detail img{width:100%;height:100%;object-fit:cover}
.rv{clip-path:none}
.sp-cover.priv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;aspect-ratio:16/11;background:var(--band);color:var(--on-band);text-align:center;padding:24px}
.priv-city{font:italic 400 clamp(48px,6.4vw,96px)/1 var(--serif);letter-spacing:-.02em}
.priv-note{opacity:.75}
@media (max-width:860px){.spread{grid-template-columns:1fr}.spread--rev .sp-cover{order:0}.sp-detail{display:none}.sp-cover{aspect-ratio:4/5}}

/* images fade in */
.sp-cover img,.sp-detail img,.tile img,.mt img{opacity:0;transition:opacity .9s ease,transform 1.4s cubic-bezier(.2,.7,.1,1)}
img.ld{opacity:1}

/* contact + footer */
.contact{background:var(--bg-2);color:var(--ink);padding:clamp(90px,10vw,150px) var(--pad) 72px}
.contact h2{margin:22px 0 clamp(36px,4vw,56px);font:italic 400 clamp(44px,6.8vw,104px)/1 var(--serif);letter-spacing:-.025em}
.mail{font:italic 400 clamp(22px,2.4vw,32px)/1.3 var(--serif);color:var(--ink);text-underline-offset:7px;text-decoration-thickness:1px}
.c-note{margin:18px 0 0;color:var(--text);opacity:.8}
.c-note a{color:var(--ink);margin-left:16px}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;background:var(--band);color:var(--on-band);padding:24px var(--pad)}
.f-mid{font:italic 400 16px/1.3 var(--serif);text-align:center}
.f-r{justify-self:end;display:flex;gap:26px}
.f-r a{color:var(--on-band);text-decoration:none}
.f-r a:hover{text-decoration:underline;text-underline-offset:4px}
.studio-link{display:none}
html.is-editor .studio-link{display:inline}
@media (max-width:720px){.foot{grid-template-columns:1fr;text-align:center}.f-r{justify-self:center}}

/* event page */
.ev-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding:36px var(--pad) clamp(48px,6vw,80px)}
.back{color:var(--ink);text-decoration:none;display:inline-block;margin-bottom:clamp(36px,5vw,64px)}
.ev-num{margin:0 0 12px;color:var(--ink);opacity:.8}
.ev-title{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.1em .28em;font:400 clamp(48px,8vw,124px)/.95 var(--serif);letter-spacing:-.03em;color:var(--ink)}
.ev-where{display:grid;gap:6px;text-align:right;color:var(--ink);padding-bottom:10px}
.ev-hero{position:relative;height:min(86vh,920px);min-height:380px;background:var(--ph);overflow:hidden}
.ev-hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ph)}
.ev-intro{padding:clamp(80px,9vw,140px) var(--pad) clamp(56px,6vw,96px)}
.rule-l{margin:0;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--ink)}
.meta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:28px 56px;margin:52px auto 40px;text-align:center}
.meta-row div{max-width:220px}
.meta-row dt{color:var(--ink);margin-bottom:6px}
.meta-row dd{margin:0;font-size:14px;line-height:1.5}
.ev-intro blockquote{margin:0 auto;max-width:46ch;text-align:center;font:italic 400 clamp(22px,2.3vw,32px)/1.4 var(--serif);color:var(--text)}
.masonry{display:flex;gap:clamp(10px,1.2vw,18px);align-items:flex-start;padding:0 var(--pad) clamp(100px,10vw,160px)}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:clamp(10px,1.2vw,18px)}
.tile{position:relative;display:block;width:100%;padding:0;border:0;background:var(--ph);overflow:hidden;cursor:zoom-in}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.tile:hover img{transform:scale(1.025)}
.tile.ph{cursor:default}
.film{position:absolute;left:10px;bottom:10px;background:var(--bg);color:var(--ink);padding:4px 8px}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px;padding:clamp(70px,8vw,110px) var(--pad);background:var(--band);color:var(--on-band);text-decoration:none}
.next .cap{opacity:.75}
.next h2{margin:14px 0 18px;font:400 clamp(40px,6.6vw,96px)/1 var(--serif);letter-spacing:-.03em;display:flex;flex-wrap:wrap;gap:.1em .28em;align-items:center}
.next h2 .t-name{font-style:italic}
.next h2 .t-logo{filter:brightness(0) invert(1)}
.next-img{width:clamp(140px,18vw,260px);aspect-ratio:1;overflow:hidden;background:var(--ph)}
.next-img img{width:100%;height:100%;object-fit:cover}
.next:hover .next-img img{transform:scale(1.04);transition:transform 1.2s cubic-bezier(.2,.7,.1,1)}
@media (max-width:720px){.ev-head{grid-template-columns:1fr}.ev-where{text-align:left}.next{grid-template-columns:1fr}.next-img{display:none}}

.private{padding:18vh var(--pad);max-width:720px;color:var(--ink)}
.private h1{font:400 clamp(40px,5vw,72px)/1 var(--serif);margin:0 0 18px}
.private p{color:var(--text);margin:0 0 28px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--lb-bg);color:var(--lb-text);opacity:0;transition:opacity .35s ease}
.lb.open{opacity:1}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 18px) var(--pad) 10px}
.lb button{background:none;border:0;color:var(--lb-text);cursor:pointer}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 clamp(48px,6vw,96px)}
.lb-media{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0}
.lb-media img,.lb-media video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;animation:fade .45s ease}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);font:400 30px/1 var(--serif);padding:20px}
.lb-prev{left:clamp(4px,1.5vw,24px)}.lb-next{right:clamp(4px,1.5vw,24px)}
.lb-cap{display:flex;justify-content:space-between;gap:20px;padding:14px var(--pad) calc(env(safe-area-inset-bottom,0px) + 20px);opacity:.85}

/* cursor */
.cursor{position:fixed;left:0;top:0;z-index:200;width:10px;height:10px;border-radius:50%;background:var(--ink);pointer-events:none;display:flex;align-items:center;justify-content:center;transition:width .35s cubic-bezier(.2,.7,.1,1),height .35s cubic-bezier(.2,.7,.1,1),background-color .3s,opacity .2s}
.cursor span{opacity:0;transition:opacity .2s;color:var(--ink);font-size:10px}
.cursor.big{width:78px;height:78px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--ink)}
.cursor.big span{opacity:1}
.cursor.hide{opacity:0}
html.has-cursor body:not(.in-studio),html.has-cursor body:not(.in-studio) a,html.has-cursor body:not(.in-studio) button{cursor:none}
html.lb-on .cursor{background:var(--lb-text)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:300;transform:translate(-50%,20px);max-width:min(560px,calc(100% - 40px));background:var(--toast-bg);color:var(--toast-text);padding:14px 20px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:32px 28px;background:var(--band);color:var(--on-band)}
.s-brand{font:italic 400 21px/1.2 var(--serif);text-decoration:none;color:var(--on-band)}
.s-sub{opacity:.6;margin-bottom:44px}
.s-nav{display:flex;flex-direction:column;gap:18px}
.s-nav a,.s-foot a{font:500 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--on-band);opacity:.62}
.s-nav a.on,.s-nav a:hover,.s-foot a:hover{opacity:1}
.s-foot{margin-top:auto}
.main{padding:36px clamp(20px,4vw,56px) 140px;min-width:0}
.s-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.s-head h1{margin:0 0 6px;font:400 clamp(30px,3.2vw,46px)/1.1 var(--serif);color:var(--ink)}
.s-actions{display:flex;flex-wrap:wrap;gap:10px}
.s-count{color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:10px 14px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{border-color:var(--ink-2);color:var(--ink-2)}
.pill{display:inline-block;font:500 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:6px 10px;background:var(--bg-2);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg)}
.back.s{margin-bottom:18px}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:-36px calc(-1 * clamp(20px,4vw,56px)) 28px;padding:14px clamp(20px,4vw,56px);background:var(--bg-2);color:var(--ink)}
.bar[hidden]{display:none}
.bar p{margin:0;font-size:14px}
.bar .s-actions{gap:8px}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;margin-bottom:28px;border:1px solid var(--ink);color:var(--ink)}
.banner p{margin:0;font-size:14px;color:var(--text)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:72px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.r-thumb{width:72px;aspect-ratio:4/5;overflow:hidden;background:var(--ph)}
.r-thumb img{width:100%;height:100%;object-fit:cover}
.r-name{font:italic 400 22px/1.2 var(--serif);color:var(--ink);text-decoration:none;display:block}
.r-sub{color:var(--muted)}
.r-loc,.r-date{font-size:14px}
.r-act{display:flex;align-items:center;gap:6px}
.r-act button{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.r-act button:disabled{opacity:.3;cursor:default}
.r-act .lnk{margin-left:10px}
.hint{color:var(--muted);font-size:13px}
@media (max-width:980px){.row{grid-template-columns:60px minmax(0,1fr) auto}.r-loc,.r-date{display:none}.row>div:nth-child(5){grid-column:2}}
.edit-layout{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;min-width:0}
.field label,.logo-slot>.cap,.m-head .cap{color:var(--ink)}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--field);color:var(--text);font:400 15px/1.5 var(--sans);border-radius:0;resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.field small{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:-4px 0 22px}
.logo-slot{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.logo-box{height:84px;display:flex;align-items:center;justify-content:center;padding:12px;border:1px solid var(--line);background:var(--field)}
.logo-box img{max-height:100%;width:auto}
.logo-box .hint{font-size:12px;text-align:center}
.logo-btns{display:flex;gap:8px}
.hero-slot .logo-box{height:220px;padding:0;overflow:hidden}
.hero-slot .logo-box img{width:100%;height:100%;object-fit:cover;max-height:none}
.danger{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:34px 20px;text-align:center;border:1px dashed var(--ink);background:color-mix(in srgb,var(--bg-2) 55%,transparent);color:var(--ink);cursor:pointer;transition:background-color .2s}
.drop.over{background:var(--bg-2)}
.drop-t{font:italic 400 22px/1.2 var(--serif)}
.drop .cap{color:var(--muted)}
.upstat{margin:16px 0}
.upstat .cap{color:var(--ink)}
.prog{height:2px;background:var(--bg-2);margin-top:10px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.fails{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.mt{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ph);cursor:grab}
.mt img,.mt video{width:100%;height:100%;object-fit:cover}
.mt{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mt img,.mt video{pointer-events:none;-webkit-user-drag:none}
.mt.placeholder{background:transparent;outline:1px dashed var(--ink);outline-offset:-1px}
.mt.placeholder>*{visibility:hidden}
.mt.ghost{position:fixed;left:0;top:0;z-index:400;margin:0;pointer-events:none;cursor:grabbing;box-shadow:0 20px 44px rgba(30,19,17,.3);transition:none}
.mt.ghost .tools{opacity:0}
.mt.sel{outline:3px solid var(--ink);outline-offset:-3px}
.mt.sel::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 16%,transparent);pointer-events:none}
.tick{position:absolute;top:6px;right:6px;z-index:2;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font-size:13px;line-height:1}
.mt.sel .badge.b2{right:36px}
.mt.gone{display:none}
.mt.ghost .count{position:absolute;top:8px;left:8px;z-index:3;min-width:30px;height:30px;padding:0 8px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);font:500 13px/1 var(--sans)}
.selbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:250;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;width:max-content;max-width:calc(100% - 24px);padding:12px 18px;background:var(--band);color:var(--on-band);box-shadow:0 14px 40px rgba(30,19,17,.32)}
.selbar .n{font:italic 400 18px/1 var(--serif);margin-right:6px}
.selbar button{background:none;border:0;color:var(--on-band);font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:9px 4px;cursor:pointer}
.selbar button:hover{text-decoration:underline;text-underline-offset:4px}
.selbar label{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.selbar input{width:62px;padding:7px 8px;border:1px solid color-mix(in srgb,var(--on-band) 50%,transparent);background:transparent;color:var(--on-band);font:400 14px var(--sans)}
.selbar .sep{width:1px;height:18px;background:color-mix(in srgb,var(--on-band) 35%,transparent)}
body.in-studio .main{padding-bottom:180px}
body.sorting,body.sorting *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.badge{position:absolute;top:6px;left:6px;font:500 9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;background:var(--ink);color:var(--bg)}
.badge.b2{left:auto;right:6px}
.badge.b3{top:auto;bottom:40px;background:var(--bg);color:var(--ink)}
.tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px 4px;background:linear-gradient(transparent,rgba(30,19,17,.72));opacity:0;transition:opacity .2s}
.mt:hover .tools,.mt:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools button{background:none;border:0;color:#F6F1EA;font-size:14px;line-height:1;padding:6px 5px;cursor:pointer}
.mcap{position:absolute;left:0;right:0;top:0;padding:28px 8px 8px;font-size:11px;line-height:1.3;color:#F6F1EA;background:linear-gradient(rgba(30,19,17,.6),transparent);pointer-events:none}
.cap-in{position:absolute;left:6px;right:6px;bottom:40px;padding:8px;font:400 13px var(--sans);border:1px solid var(--ink);background:var(--field);color:var(--text)}
.empty{padding:40px 0;color:var(--muted);font-size:14px}
.meter{margin:8px 0 18px;font-size:14px}
@media (max-width:900px){
  .studio{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:20px}
  .s-sub{margin:0}
  .s-nav{flex-direction:row;gap:20px}
  .s-foot{margin:0}
  .edit-layout{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .rv{clip-path:none}
  .marquee-track{animation:none}
}
.tile.ph{display:flex}
.hero .ph::before{content:none}

function colCount(){ var w = window.innerWidth; return w >= 1200 ? 5 : w >= 900 ? 4 : w >= 600 ? 3 : 2; }

/* ---------- lightbox ---------- */
var lb = null, lbIdx = 0, lastFocus = null;
function openLB(i){
  if (!lb){
    lb = document.createElement('div'); lb.className = 'lb'; lb.hidden = true;
    lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Gallery viewer');
    lb.innerHTML = '<div class="lb-top"><button class="cap" data-lbx="close">Close ✕</button></div><div class="lb-stage"><button class="lb-prev" data-lbx="prev" aria-label="Previous">←</button><div class="lb-media"></div><button class="lb-next" data-lbx="next" aria-label="Next">→</button></div><div class="lb-cap cap"><span class="lb-c"></span><span class="lb-n"></span></div>';
    document.body.appendChild(lb);
    lb.addEventListener('click', function(e){
      var b = e.target.closest('[data-lbx]');
      if (b){ var a = b.getAttribute('data-lbx'); if (a === 'close') closeLB(); else stepLB(a === 'next' ? 1 : -1); }
      else if (e.target.classList.contains('lb-stage') || e.target.classList.contains('lb-media')) closeLB();
    });
    var sx = null;
    lb.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function(e){ if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1); sx = null; });
  }
  lastFocus = document.activeElement; lbIdx = i; lb.hidden = false;
  document.documentElement.classList.add('lb-on');
  requestAnimationFrame(function(){ lb.classList.add('open'); });
  showLB(); lb.querySelector('[data-lbx=close]').focus();
}
function showLB(){
  var m = mItems[lbIdx], box = lb.querySelector('.lb-media');
  box.innerHTML = m.v ? '<video src="' + B(m.f) + '" controls autoplay muted playsinline></video>' : '<img src="' + B(m.f) + '" alt="' + esc(m.c || mTitle) + '">';
  lb.querySelector('.lb-c').textContent = m.c || mTitle;
  lb.querySelector('.lb-n').textContent = pad2(lbIdx + 1) + ' / ' + pad2(mItems.length);
  [1, -1].forEach(function(d){ var o = mItems[(lbIdx + d + mItems.length) % mItems.length]; if (o && !o.v){ var im = new Image(); im.src = B(o.f); } });
}
function stepLB(d){ lbIdx = (lbIdx + d + mItems.length) % mItems.length; showLB(); }
function closeLB(){
  if (!lb || lb.hidden) return;
  lb.classList.remove('open'); document.documentElement.classList.remove('lb-on');
  setTimeout(function(){ lb.hidden = true; lb.querySelector('.lb-media').innerHTML = ''; }, 320);
  if (lastFocus) lastFocus.focus();
}
document.addEventListener('keydown', function(e){
  if (!lb || lb.hidden) return;
  if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowRight') stepLB(1); else if (e.key === 'ArrowLeft') stepLB(-1);
});

/* ---------- media helpers ---------- */
document.addEventListener('load', function(e){ if (e.target.tagName === 'IMG') e.target.classList.add('ld'); }, true);
document.addEventListener('error', function(e){
  var t = e.target; if (!t || (t.tagName !== 'IMG' && t.tagName !== 'VIDEO')) return;
  var src = t.getAttribute('src') || '', mm = src.match(/([0-9a-f]{32})/);
  var id = t.getAttribute('data-blob') || (mm && mm[1]);
  if (id){
    var list = candidates(id), tried = +(t.getAttribute('data-try') || 0) + 1;
    if (tried < list.length){ t.setAttribute('data-try', tried); t.setAttribute('src', list[tried] + (t.tagName === 'VIDEO' ? '#t=0.1' : '')); return; }
  }
  if (t.tagName === 'IMG') t.classList.add('ld');
}, true);
function afterImages(scope){ (scope || root).querySelectorAll('img').forEach(function(i){ if (i.complete) i.classList.add('ld'); }); }
var vidIO = 'IntersectionObserver' in window ? new IntersectionObserver(function(es){
  es.forEach(function(en){ var v = en.target; if (en.isIntersecting){ var p = v.play(); if (p && p.catch) p.catch(function(){}); } else v.pause(); });
}, { threshold: 0.3 }) : null;

var revIO = 'IntersectionObserver' in window ? new IntersectionObserver(function(es){
  es.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add('in'); revIO.unobserve(en.target); } });
}, { threshold: 0.15 }) : null;

/* ---------- router ---------- */
function route(){ try { return decodeURIComponent((location.hash || '').slice(1)); } catch (e) { return ''; } }

function render(){
  var r = route();
  if ((r === '' || r === 'events' || r === 'contact') && view === 'home' && !first){
    if (r) scrollToId(r, true); else window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
    return;
  }
  var swap = function(){
    document.body.classList.toggle('in-studio', isStudio(r));
    var html, after = null;
    if (isStudio(r)){ html = studioHTML(r); view = 'studio'; after = studioAfter; }
    else {
      var ev = null; visibleEvents().forEach(function(e){ if (e.id === r && !e.noPhotos) ev = e; });
      if (ev){
        html = eventHTML(ev); view = 'event';
        mTitle = fullTitle(ev);
        mItems = ev.media.length ? ev.media : FAKE.map(function(f){ return { ph: true, w: f[0], h: f[1] }; });
        after = function(){ mCols = 0; layoutMasonry(true); };
      } else { html = homeHTML(); view = 'home'; }

  window.addEventListener('mousemove', function(e){
    x = e.clientX; y = e.clientY;

async function checkStorage(clean){

/* --- export a static copy for GitHub Pages --- */
var exporting = false;
function extFor(type){ type = String(type || '').split(';')[0].trim(); return { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/svg+xml': 'svg', 'video/mp4': 'mp4', 'video/webm': 'webm' }[type] || 'jpg'; }
async function fetchAsset(id){
  var list = candidates(id), last = null;
  for (var i = 0; i < list.length; i++){
    try { var r = await fetch(list[i], { credentials: 'include' }); if (r.ok) return r; last = new Error('HTTP ' + r.status); } catch (e) { last = e; }
  }

function loadZipLib(){

async function exportSite(btn){

    add(d.site.heroId);
    d.events.forEach(function(e){ add(e.titleLogo); add(e.venueLogo); e.media.forEach(function(m){ add(m.f); add(m.t); }); });

    st.textContent = 'Ready. Confirm the download (' + (blob.size / 1048576).toFixed(0) + ' MB).';
    await dl.save({ filename: 'elizabeth-aperghis-website.zip', data: blob });
    st.textContent = 'Downloaded. Unzip it and upload the contents to your GitHub repository.';
  } catch (e){
    var c = e && e.code;

}

    '<script id="site-data" type="application/json">' + json + '</' + 'script>\n<script id="app">' + app + '</' + 'script></body>\n</html>\n';
}
